# feeder
feeder: feeders.feeder.Feeder
test_feeder_args:
  data_path: ./data/DS_RGB_19/val_data_joint.npy
  label_path: ./data/DS_RGB_19/val_label.pkl
  debug: False

# model
model: model.AGCN.Model
model_args:
  num_class: 27
  num_person: 2
  num_point: 18
  graph: graph.DS.Graph
  graph_args:
    labeling_mode: 'spatial'


# test 
phase: test
device: [0]
test_batch_size: 16
weights: # your model result


work_dir: ./work_dir/Transfer_RGB/agcn1_joint_test
model_saved_name: ./runs/RGBTrans_agcn1_joint_test
save_score: True